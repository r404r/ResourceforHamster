name: CSkin Release

on:
  push:
    tags:
      - 'release/**'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Fetch all tags with their annotations
          fetch-tags: true

      - name: Extract tag name and message
        id: tag
        run: |
          # Remove 'release/' prefix from tag
          TAG_NAME="${GITHUB_REF#refs/tags/release/}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Tag name without prefix: $TAG_NAME"

          # 预发布约定（RIME-20260926-010）：tag 带 -alpha / -beta / -rc / -exp / -test 后缀
          # （如 release/v6.0.2.0-exp1）→ 标记为 pre-release，且不设为 Latest
          if [[ "$TAG_NAME" =~ -(alpha|beta|rc|exp|test)[0-9.]*$ ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "Prerelease: $PRERELEASE"
          
          # Debug: Check tag type and availability
          echo "Checking tag: ${GITHUB_REF}"
          git cat-file -t "${GITHUB_REF}" || echo "Tag object not found"
          
          # Get tag message (annotation), excluding PGP signature
          # Use git tag -l --format instead of for-each-ref for better compatibility
          TAG_MESSAGE=$(git tag -l --format='%(contents:subject)%0a%(contents:body)' "release/${TAG_NAME}" | sed '/^-----BEGIN PGP SIGNATURE-----$/,/^-----END PGP SIGNATURE-----$/d' | sed '/^$/d')
          
          # Debug output
          echo "Extracted tag message length: ${#TAG_MESSAGE}"
          
          # If tag message is empty, try to get commit message
          if [ -z "$TAG_MESSAGE" ]; then
            echo "No tag annotation found, using commit message"
            TAG_MESSAGE=$(git log -1 --pretty=format:%s "${GITHUB_REF}")
          fi
          
          echo "tag_message<<EOF" >> $GITHUB_OUTPUT
          echo "$TAG_MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Tag message: $TAG_MESSAGE"

      - name: Find previous release tag
        id: prev
        env:
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          # 对比基准：当前 commit 祖先中最近创建的另一个 release/* tag（RIME-20260926-009）。
          # 只看祖先链，避免与其他分支上的发布比较；找不到基准（首次发布）时全部打包。
          # 正式版只与上一个正式版比较（跳过 -alpha/-beta/-rc/-exp/-test 预发布），否则由预发布转正时没有变更、不会打包（RIME-20260926-014）
          PRE_RE='-(alpha|beta|rc|exp|test)[0-9.]*$'
          if [[ "$CURRENT_TAG" =~ $PRE_RE ]]; then
            PREV_TAG=$(git tag --merged HEAD --list 'release/*' --sort=-creatordate | grep -vxF "$CURRENT_TAG" | head -n 1 || true)
          else
            PREV_TAG=$(git tag --merged HEAD --list 'release/*' --sort=-creatordate | grep -vxF "$CURRENT_TAG" | grep -vE -- "$PRE_RE" | head -n 1 || true)
          fi
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$PREV_TAG" ]; then
            echo "Previous release tag: $PREV_TAG ($(git rev-parse --short "$PREV_TAG^{commit}"))"
          else
            echo "No previous release tag found in history; every skin will be packaged"
          fi

      - name: Check and package 元书- directories
        id: yuanshu_dirs
        env:
          TAG_NAME: ${{ steps.tag.outputs.tag_name }}
          PREV_TAG: ${{ steps.prev.outputs.prev_tag }}
        run: |
          # Set UTF-8 locale to handle Chinese characters properly
          export LANG=C.UTF-8
          export LC_ALL=C.UTF-8

          # 目录自上一个 release 以来有变更才打包（无基准时视为有变更）
          changed() { [ -z "$PREV_TAG" ] || ! git diff --quiet "$PREV_TAG" HEAD -- "$1"; }

          # 资产名必须是 ASCII：GitHub 会规范化非 ASCII 文件名（元书-空山素影_vX.cskin → -._vX.cskin），
          # 多个包会被改成同一个名字而互相覆盖。元书按包内目录名导入，不依赖资产文件名。
          asset_base() {
            case "$1" in
              元书-仿仓默认) echo "fangcang-moren-ys" ;;
              元书-空山素影) echo "kongshan-suying-ys" ;;
              元书-送你一朵小红花-元书) echo "xiaohonghua-ys" ;;
              *)
                local h
                h=$(printf '%s' "$1" | sha1sum | cut -c1-8)
                echo "::warning::No ASCII asset name mapped for $1; using ys-skin-$h (add it to asset_base)" >&2
                echo "ys-skin-$h" ;;
            esac
          }

          PACKAGED_FILES=""
          PACKAGED_NOTES=""

          # Find all directories starting with "元书-" in Skin_Keyboard
          for dir in Skin_Keyboard/元书-*; do
            [ -d "$dir" ] || continue
            DIR_NAME=$(basename "$dir")

            if ! changed "$dir"; then
              echo "Unchanged since $PREV_TAG, skipping: $dir"
              continue
            fi
            echo "Changed since ${PREV_TAG:-<none>}: $dir"
            [ -n "$PREV_TAG" ] && git diff --stat "$PREV_TAG" HEAD -- "$dir" | tail -n 1

            ASSET="$(asset_base "$DIR_NAME")_${TAG_NAME}.cskin"
            if [[ ! "$ASSET" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::Asset name is not ASCII-safe: $ASSET"
              exit 1
            fi

            # Create zip file (exclude macOS metadata files)
            (cd Skin_Keyboard && zip -r "$ASSET" "${DIR_NAME}" -x "*.DS_Store" -x "__MACOSX" -x "._*")
            PACKAGED_FILES="${PACKAGED_FILES}Skin_Keyboard/${ASSET}"$'\n'
            PACKAGED_NOTES="${PACKAGED_NOTES}- \`${ASSET}\`：${DIR_NAME}"$'\n'
            echo "Packaged: ${ASSET} (${DIR_NAME})"
          done

          # Save packaged files list
          {
            echo "packaged_files<<EOF"
            printf '%s' "$PACKAGED_FILES"
            echo "EOF"
            echo "packaged_notes<<EOF"
            printf '%s' "$PACKAGED_NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check and package WanxiangSkin directory
        id: wanxiangskin_dir
        env:
          TAG_NAME: ${{ steps.tag.outputs.tag_name }}
          PREV_TAG: ${{ steps.prev.outputs.prev_tag }}
        run: |
          # v7 起的主皮肤：上游 WanxiangSkin + r404r 覆盖层（RIME-20260926-014，ADR-0006）
          export LANG=C.UTF-8
          export LC_ALL=C.UTF-8

          changed() { [ -z "$PREV_TAG" ] || ! git diff --quiet "$PREV_TAG" HEAD -- "$1"; }

          TARGET_DIR="Skin_Keyboard/万象-元书/WanxiangSkin"
          ASSET="wanxiangskin-r404r_${TAG_NAME}.cskin"
          PACKAGED_FILES=""
          PACKAGED_NOTES=""

          if [ ! -d "$TARGET_DIR" ]; then
            echo "Directory $TARGET_DIR does not exist"
          elif ! changed "$TARGET_DIR"; then
            echo "Unchanged since $PREV_TAG, skipping: $TARGET_DIR"
          else
            echo "Changed since ${PREV_TAG:-<none>}: $TARGET_DIR"
            [ -n "$PREV_TAG" ] && git diff --stat "$PREV_TAG" HEAD -- "$TARGET_DIR" | tail -n 1

            # 与上游 workflow 相同：把 tag 写入 version.txt（仓库中为空文件）
            printf '%s\n' "$TAG_NAME" > "$TARGET_DIR/version.txt"
            (cd Skin_Keyboard/万象-元书 && zip -r "$ASSET" "WanxiangSkin" -x "*.DS_Store" -x "__MACOSX" -x "._*")
            PACKAGED_FILES="Skin_Keyboard/万象-元书/${ASSET}"
            PACKAGED_NOTES="- \`${ASSET}\`：WanxiangSkin（万象键盘r404r，v7 起的主皮肤）"
            echo "Packaged: ${ASSET}"
          fi

          {
            echo "packaged_files<<EOF"
            echo "$PACKAGED_FILES"
            echo "EOF"
            echo "packaged_notes<<EOF"
            echo "$PACKAGED_NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Combine packaged files list
        id: all_files
        env:
          FILES_YUANSHU: ${{ steps.yuanshu_dirs.outputs.packaged_files }}
          NOTES_YUANSHU: ${{ steps.yuanshu_dirs.outputs.packaged_notes }}
          FILES_WANXIANGSKIN: ${{ steps.wanxiangskin_dir.outputs.packaged_files }}
          NOTES_WANXIANGSKIN: ${{ steps.wanxiangskin_dir.outputs.packaged_notes }}
        run: |
          # Remove empty lines
          FILES=$(printf '%s\n%s\n' "$FILES_WANXIANGSKIN" "$FILES_YUANSHU" | sed '/^$/d')
          NOTES=$(printf '%s\n%s\n' "$NOTES_WANXIANGSKIN" "$NOTES_YUANSHU" | sed '/^$/d')
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          
          # Clean up any macOS metadata files in the workspace
          echo "Searching for metadata files to clean up..."
          find . -name "._*" -type f
          find . -name "._*.cskin" -type f -delete
          
          # List all .cskin files to verify
          echo "All .cskin files in workspace:"
          find . -name "*.cskin" -type f
          
          echo "All packaged files:"
          echo "$FILES"
          
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          # Save build date
          BUILD_DATE=$(date -u +%Y-%m-%d)
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "Build date: $BUILD_DATE"

      - name: Create Release
        if: steps.all_files.outputs.files != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.tag.outputs.tag_name }}
          body: |
            ## 元书 皮肤包发布

            构建日期： ${{ steps.all_files.outputs.build_date }}

            对比基准： ${{ steps.prev.outputs.prev_tag || '（无，首次发布）' }}（仅打包自该版本以来有变更的皮肤）
            
            ### 包含文件（资产名：皮肤目录）：
            ${{ steps.all_files.outputs.notes }}

            ### 使用说明：
            下载 .cskin 文件后，在元书输入法中导入即可，或者在iOS中直接点击此文件，选择元书输入法打开
            
            ---
            
            ### 更新说明：
            ${{ steps.tag.outputs.tag_message }}
            
          files: ${{ steps.all_files.outputs.files }}
          fail_on_unmatched_files: true
          prerelease: ${{ steps.tag.outputs.prerelease }}
          make_latest: ${{ steps.tag.outputs.prerelease == 'true' && 'false' || 'true' }}
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No files to release
        if: steps.all_files.outputs.files == ''
        run: |
          echo "::warning::No skin changed since ${{ steps.prev.outputs.prev_tag }}. No release created."
          exit 0
